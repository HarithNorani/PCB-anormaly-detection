<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">PCB visual inspection workflow</title>
  <desc id="desc">Workflow from paired PCB images through classical and AI inspection to reports and error analysis.</desc>
  <defs>
    <style>
      .box { fill: #f5f7fb; stroke: #26354a; stroke-width: 2; rx: 12; }
      .accent { fill: #e4f2ed; stroke: #26735b; stroke-width: 2; rx: 12; }
      .ai { fill: #e8eefb; stroke: #345ea8; stroke-width: 2; rx: 12; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182333; font-size: 16px; text-anchor: middle; }
      .small { font-size: 13px; }
      .arrow { stroke: #52657d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52657d"/>
    </marker>
  </defs>
  <rect width="1100" height="430" fill="#ffffff"/>
  <text x="550" y="35" class="text" style="font-size:24px;font-weight:700">PCB Visual Inspection Workflow</text>
  <rect x="35" y="82" width="180" height="90" class="box"/>
  <text x="125" y="113" class="text">DeepPCB input</text>
  <text x="125" y="139" class="text small">tested image</text>
  <text x="125" y="159" class="text small">+ defect-free template</text>
  <rect x="260" y="82" width="180" height="90" class="accent"/>
  <text x="350" y="113" class="text">Validate &amp; prepare</text>
  <text x="350" y="139" class="text small">parse boxes</text>
  <text x="350" y="159" class="text small">export YOLO labels</text>
  <path d="M215 127 H260" class="arrow"/>
  <path d="M440 127 H550" class="arrow"/>
  <rect x="550" y="62" width="210" height="130" class="box"/>
  <text x="655" y="94" class="text">Classical baseline</text>
  <text x="655" y="120" class="text small">registration</text>
  <text x="655" y="140" class="text small">template difference</text>
  <text x="655" y="160" class="text small">connected components</text>
  <rect x="550" y="238" width="210" height="130" class="ai"/>
  <text x="655" y="270" class="text">Six-class YOLO</text>
  <text x="655" y="296" class="text small">localize + classify</text>
  <text x="655" y="316" class="text small">open / short / mousebite</text>
  <text x="655" y="336" class="text small">spur / copper / pin-hole</text>
  <path d="M440 127 H500 V303 H550" class="arrow"/>
  <path d="M760 127 H835 V213 H900" class="arrow"/>
  <path d="M760 303 H835 V213 H900" class="arrow"/>
  <rect x="900" y="168" width="165" height="90" class="accent"/>
  <text x="982" y="199" class="text">Evidence</text>
  <text x="982" y="225" class="text small">metrics &amp; plots</text>
  <text x="982" y="245" class="text small">thresholds &amp; failures</text>
  <path d="M982 258 V310" class="arrow"/>
  <rect x="855" y="310" width="255" height="80" class="box"/>
  <text x="982" y="341" class="text">Industrial interpretation</text>
  <text x="982" y="367" class="text small">false rejects, missed defects, speed</text>
</svg>
