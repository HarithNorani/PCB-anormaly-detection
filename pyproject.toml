[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-inspection"
version = "0.1.0"
description = "Reproducible template-based PCB defect inspection experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ai = [
    "ultralytics>=8.3",
]

[project.scripts]
pcb-inspect = "pcb_inspection.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["pcb_inspection*"]
